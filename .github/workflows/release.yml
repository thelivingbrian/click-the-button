name: Release production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: click-the-button-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://click-the-button.com
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
          python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Build release
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags="-s -w -X main.buildRevision=$GITHUB_SHA" -o dist/package/server ./server
          cp -R server/assets server/templates server/sql dist/package/
          printf '%s\n' "$GITHUB_SHA" > dist/package/REVISION
          tar -czf dist/click-the-button-linux-amd64.tar.gz -C dist/package server assets templates sql REVISION
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          bundle = pathlib.Path('dist/click-the-button-linux-amd64.tar.gz')
          pathlib.Path('dist/release.json').write_text(json.dumps({'revision': os.environ['GITHUB_SHA'], 'sha256': hashlib.sha256(bundle.read_bytes()).hexdigest()}) + '\n')
          PY
      - name: Publish production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="production-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/click-the-button-linux-amd64.tar.gz dist/release.json \
            --target "$GITHUB_SHA" --title "Production $GITHUB_SHA" \
            --notes "Tested Linux release. The production server checks for updates every two minutes, backs up results, and verifies health after deployment." --latest
      - name: Verify live revision
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen('https://click-the-button.com/healthz', timeout=10) as response:
                      health = json.load(response)
                  if health == {'status': 'ok', 'revision': os.environ['GITHUB_SHA']}:
                      print('Production is serving', health['revision'])
                      break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise SystemExit('Release published, but production did not confirm it. Inspect click-the-button-release.service on the droplet.')
          PY
